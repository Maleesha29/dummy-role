---
# tasks file for httpd

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0

- name: Install apache httpd
  ansible.builtin.apt:
    name: apache2
    state: present
  register: apt_result
  retries: 5
  delay: 30
  until: apt_result is succeeded

- name: Copy file with owner and permissions
  ansible.builtin.copy:
    src: files/index.html
    dest: /var/www/html
    owner: root
    group: root
    mode: "0644"
